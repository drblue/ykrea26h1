		<path fill="#858e98" d="M95 123 Q112 117 131 124 L145 165 L138 190 Q117 197 98 190 L86 163Z"/>
		<path fill="#858e98" d="m96 129-20 16 13 19 12-11-6-8 12-9"/>
		<path fill="#172331" d="m83 149 13-4 5 9-12 10Z"/>
		<g class="umbrella-arm">
			<path fill="#858e98" d="m132 124 23 13q6 5 0 13l-8 2-20-14Z"/>
