		<path fill="none" stroke="#52687c" stroke-width="2" d="m84 66 2 13 m56-13-2 13"/>
	</g>

	</g>
	<g fill="none" stroke="#91b5cb" stroke-width="3" stroke-linecap="round" opacity=".55">
