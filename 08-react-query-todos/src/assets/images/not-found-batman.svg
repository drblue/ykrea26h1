<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
	<title id="title">404: Batman took a wrong turn</title>
	<desc id="desc">Batman shelters under an umbrella beside a sign pointing in both directions to a missing page.</desc>
	<style>
		.hero { animation: brace 1.6s ease-in-out infinite; transform-origin: 112px 211px; }
		.cape { animation: flutter 0.8s ease-in-out infinite alternate; transform-origin: 111px 125px; }
		.umbrella-arm { animation: shoulder 1.6s ease-in-out infinite; transform-origin: 132px 129px; }
		.umbrella { animation: gust 1.6s ease-in-out infinite; transform-origin: 151px 140px; }
		.rain { animation: rain 0.7s linear infinite; }
		.rain-late { animation-delay: -0.35s; }
		@keyframes brace { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(2px); } }
		@keyframes flutter { from { transform: skewY(-4deg) scaleX(0.94); } to { transform: skewY(5deg) scaleX(1.04); } }
		@keyframes shoulder { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
		@keyframes gust { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
		@keyframes rain { from { transform: translate(-5px, -8px); opacity: 0; } 25%, 75% { opacity: 0.6; } to { transform: translate(6px, 12px); opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .hero, .cape, .umbrella-arm, .umbrella, .rain { animation: none; } }
	
		.question { animation: wonder 2.4s ease-in-out infinite; }
		@keyframes wonder { 0%, 100% { opacity: .65; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }
		@media (prefers-reduced-motion: reduce) { .question { animation: none; } }
	</style>
	<ellipse cx="325" cy="321" rx="265" ry="12" fill="#90a4b5" opacity=".12"/>
	<text x="43" y="237" fill="#26394d" stroke="#90a4b5" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="156" font-weight="900" letter-spacing="-9">404</text>
	<g stroke="#90a4b5" stroke-width="2.5" stroke-linejoin="round">
		<path d="M178 253v61" stroke-width="8"/>
		<path d="M98 250h142l22 18-22 18H98l-22-18Z" fill="#e7a16c"/>
		<path d="M113 268h28m-14-9-10 9 10 9m66-9h28m-14-9 10 9-10 9" fill="none" stroke="#26394d" stroke-width="4" stroke-linecap="round"/>
	</g>
	<g class="question" fill="#e8b94f" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
		<text x="328" y="120" font-size="48" transform="rotate(-14 328 120)">?</text>
		<text x="363" y="81" font-size="28" transform="rotate(12 363 81)">?</text>
	</g>
	<g transform="translate(315 26) scale(1.3)">
	<g class="hero" stroke="#90a4b5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
