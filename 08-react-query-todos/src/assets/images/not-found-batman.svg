			<path fill="none" stroke="#f5d88a" stroke-width="4" d="M165 19V129 Q165 143 153 139"/>
			<g transform="translate(11 0)">
			<path fill="#e7a16c" stroke="#f3c79d" d="M83 64 Q102 19 154 19 Q206 19 225 64 Q207 51 189 64 Q171 51 154 64 Q137 51 119 64 Q101 51 83 64Z"/>
			<path fill="none" stroke="#be794c" stroke-width="2" d="M154 20 Q130 33 119 64 M154 20V64 M154 20 Q178 33 189 64"/>
			<path stroke="#e7a16c" stroke-width="4" d="M154 18V12"/>
			</g>
			<path fill="#858e98" d="m145 137 14-15 12 10-16 20q-5 3-10-2Z"/>
			<path fill="#172331" d="m156 126 3-8q2-4 6-3l7 2q4 2 3 6l-2 9-9 5Z"/>
			<path fill="none" stroke="#52687c" stroke-width="2" d="m165 120 7 2 m-8 3 7 2"/>
		</g>
		</g>
		<path fill="#e8b94f" stroke="#f0cf80" d="M95 168h48l-3 11H97Z"/>
